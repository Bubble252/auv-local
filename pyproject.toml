[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auv-local"
version = "0.1.0"
description = "Modular local planning and reactive navigation contracts for underwater vehicles."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "auv-core>=0.1.0"]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.9",
    "mypy>=1.10,<2",
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.11",
]
viz = [
    "plotly>=6.0",
]
rl = [
    "gymnasium==0.29.1",
]
training = [
    "gymnasium==0.29.1",
    "stable-baselines3==2.8.0",
    "torch==2.7.0",
]

[tool.uv.sources]
auv-core = { path = "../settled_共享基础", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auv_local = ["py.typed"]
auv_lowlevel = ["py.typed"]
auv_rl = ["py.typed"]
auv_isaaclab = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["src/auv_local", "src/auv_lowlevel", "src/auv_rl", "src/auv_isaaclab", "tests"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
include = ["src/auv_local", "src/auv_lowlevel", "src/auv_rl", "src/auv_isaaclab", "tests"]
venvPath = ".."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
extraPaths = ["src"]
reportUnsupportedDunderAll = "none"
