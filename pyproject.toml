[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auv-local"
version = "0.1.0"
description = "Modular local planning and reactive navigation contracts for underwater vehicles."
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "auv-planner>=0.1.0"]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.uv.sources]
auv-planner = { path = "../settled_全局规划器", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auv_local = ["py.typed"]
auv_rl = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "../settled_全局规划器/src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["src/auv_local", "src/auv_rl", "tests"]
mypy_path = "src:../settled_全局规划器/src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
include = ["src/auv_local", "src/auv_rl", "tests"]
venvPath = ".."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
extraPaths = ["src", "../settled_全局规划器/src"]
reportUnsupportedDunderAll = "none"
